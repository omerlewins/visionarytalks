<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Who owns Mistral AI? Strategic investors, an 11% stake and fresh dilution</title><desc id="desc">Mistral AI is privately owned; ASML disclosed an approximately 11% fully diluted stake in September 2025.</desc><rect width="1200" height="630" fill="#f3f2ef"/><path d="M60 85H1140M60 480H1140" stroke="#161616"/><g fill="#161616" font-family="Arial,sans-serif"><text x="60" y="58" font-size="17" letter-spacing="3">VISIONARY TALKS / OWNERSHIP FILE</text><text x="60" y="175" font-size="62">Mistral AI</text><text x="60" y="238" font-size="25">Founders and private investors</text><text x="60" y="366" font-size="74">~11%</text><text x="60" y="416" font-size="23">ASML disclosed stake, Sep 2025</text><text x="60" y="535" font-size="20">PRIVATE COMPANY · RESEARCH CHECKED 2026-10-11</text><text x="60" y="577" font-size="18">Dated records. Clear ownership. Daniel Mercer.</text></g></svg>
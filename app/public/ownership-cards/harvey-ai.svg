<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Who owns Harvey? The $550M round behind its $15.5B valuation</title><desc id="desc">Harvey is privately owned; its September 2026 round raised $550 million at a $15.5 billion valuation.</desc><rect width="1200" height="630" fill="#f3f2ef"/><path d="M60 85H1140M60 480H1140" stroke="#161616"/><g fill="#161616" font-family="Arial,sans-serif"><text x="60" y="58" font-size="17" letter-spacing="3">VISIONARY TALKS / OWNERSHIP FILE</text><text x="60" y="175" font-size="62">Harvey</text><text x="60" y="238" font-size="25">Founders and private investors</text><text x="60" y="366" font-size="74">$550M</text><text x="60" y="416" font-size="23">Sep 2026 capital raised</text><text x="60" y="535" font-size="20">PRIVATE COMPANY · RESEARCH CHECKED 2026-10-11</text><text x="60" y="577" font-size="18">Dated records. Clear ownership. Daniel Mercer.</text></g></svg>